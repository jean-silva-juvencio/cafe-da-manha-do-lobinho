<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Galeria | Café do Lobinho</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #121212;
            color: #e0e0e0;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
            padding-top: 80px;
        }
        
        /* ANIMAÇÕES */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ========== BARRA SUPERIOR (MENU) ========== */
        .barra-superior {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(18,18,18,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        
        .logo-galeria {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-galeria i {
            font-size: 1.6rem;
            color: #d4af37;
        }
        
        .logo-galeria span {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37, #f5e56b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .area-direita {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .btn-tema {
            background: rgba(212,175,55,0.15);
            border: 1px solid rgba(212,175,55,0.5);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #d4af37;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-tema:hover {
            background: rgba(212,175,55,0.3);
            transform: scale(1.02);
        }
        
        .btn-tema.animar {
            animation: girar 0.5s ease;
        }
        
        .hamburger {
            background: linear-gradient(135deg, #d4af37, #f5e56b);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .hamburger span {
            width: 20px;
            height: 2px;
            background: #1a1a1a;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        
        /* Menu Lateral */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #1a1a1a;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1100;
            transition: left 0.3s ease;
            padding: 90px 20px 20px;
        }
        
        body.tema-claro .sidebar {
            background: #ffffff;
        }
        
        .sidebar.open {
            left: 0;
        }
        
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            text-decoration: none;
            color: #e0e0e0;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s;
        }
        
        body.tema-claro .sidebar a {
            color: #1a1a1a;
        }
        
        .sidebar a:hover {
            background: rgba(212,175,55,0.2);
        }
        
        .sidebar .divider {
            height: 1px;
            background: rgba(212,175,55,0.2);
            margin: 15px 0;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1050;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* ========== CONTEÚDO PRINCIPAL ========== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .titulo {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .titulo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37, #f5e56b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .titulo p {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }
        
        /* GALERIA DE IMAGENS */
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .galeria-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1 / 1;
        }
        
        .galeria-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .galeria-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(212,175,55,0.3);
        }
        
        .galeria-item:hover img {
            transform: scale(1.05);
        }
        
        /* VÍDEO DESTAQUE (MAIOR) */
        .video-destaque {
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(212,175,55,0.3);
        }
        
        .video-destaque video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .video-label {
            text-align: center;
            padding: 15px;
            background: rgba(212,175,55,0.1);
            font-size: 0.85rem;
            color: #d4af37;
        }
        
        /* MODAL PARA AMPLIAR IMAGEM */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            border: 2px solid #d4af37;
        }
        
        .fechar-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #d4af37;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .fechar-modal:hover {
            transform: scale(1.1);
        }
        
        /* TEMA CLARO */
        body.tema-claro {
            background: #fef9e8;
            color: #1a1a1a;
        }
        
        body.tema-claro .barra-superior {
            background: rgba(255,255,245,0.95);
        }
        
        body.tema-claro .titulo p {
            color: #666;
        }
        
        body.tema-claro .galeria-item {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        /* RESPONSIVO */
        @media (max-width: 900px) {
            .galeria-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }
        
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }
            
            .barra-superior {
                padding: 10px 16px;
            }
            
            .logo-galeria span {
                font-size: 0.9rem;
            }
            
            .btn-tema {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
            
            .hamburger {
                width: 35px;
                height: 35px;
            }
            
            .container {
                padding: 20px 15px;
            }
            
            .titulo h1 {
                font-size: 1.5rem;
            }
            
            .galeria-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .galeria-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body>

<!-- BARRA SUPERIOR -->
<div class="barra-superior">
    <div class="logo-galeria">
        <i class="fas fa-images"></i>
        <span>GALERIA DO LOBINHO</span>
    </div>
    <div class="area-direita">
        <div class="btn-tema" onclick="alternarTema()">
            <i class="fas fa-sun"></i> <i class="fas fa-moon"></i> TEMA
        </div>
        <div class="hamburger" id="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="fecharMenu()"></div>

<!-- Menu Lateral -->
<div id="sidebar" class="sidebar">
    <a href="index.html" onclick="fecharMenu()"><i class="fas fa-home"></i> INÍCIO</a>
    <a href="index.html#cardapio" onclick="fecharMenu()"><i class="fas fa-utensils"></i> CARDÁPIO</a>
    <a href="galeria.html" onclick="fecharMenu()"><i class="fas fa-images"></i> GALERIA</a>
    <a href="radio.html" onclick="fecharMenu()"><i class="fas fa-headphones"></i> RÁDIO DO LOBINHO</a>
    <a href="index.html#localizacao" onclick="fecharMenu()"><i class="fas fa-map-marker-alt"></i> LOCALIZAÇÃO</a>
    <div class="divider"></div>
    <a href="https://www.instagram.com/cafedolobinho/" target="_blank"><i class="fab fa-instagram"></i> INSTAGRAM</a>
    <a href="https://wa.me/5592992674472" target="_blank"><i class="fab fa-whatsapp"></i> WHATSAPP</a>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="container">
    <div class="titulo">
        <h1>📸 Momentos Registrados</h1>
        <p>Fotos e vídeos especiais dos nossos clientes e do ambiente do Café do Lobinho</p>
    </div>
    
    <!-- GALERIA DE IMAGENS -->
    <div class="galeria-grid" id="galeriaGrid">
        <!-- As imagens serão carregadas via JavaScript -->
        <div style="text-align: center; grid-column: 1/-1; padding: 50px;">Carregando galeria...</div>
    </div>
    
    <!-- VÍDEO EM DESTAQUE -->
    <div class="video-destaque">
        <video id="videoLobinho" controls>
            <source src="video1.mp4" type="video/mp4">
            Seu navegador não suporta vídeo.
        </video>
        <div class="video-label">
            <i class="fas fa-video"></i> Momentos especiais no Café do Lobinho
        </div>
    </div>
</div>

<!-- MODAL PARA AMPLIAR -->
<div id="modal" class="modal" onclick="fecharModal()">
    <span class="fechar-modal">&times;</span>
    <div class="modal-content">
        <img id="modalImg" src="">
    </div>
</div>

<script>
    // ========== LISTA DAS IMAGENS ==========
    // ALTERE OS NOMES DOS ARQUIVOS AQUI CONFORME SUAS IMAGENS
    // As imagens devem estar na MESMA PASTA que o arquivo galeria.html
    const imagens = [
        { arquivo: "lobinho1.jpeg" },
        { arquivo: "lobinho2.jpeg" },
        { arquivo: "lobinho3.jpeg" },
        { arquivo: "lobinho4.jpeg" },
        { arquivo: "lobinho5.jpeg" },
        { arquivo: "lobinho6.jpeg" },
        { arquivo: "lobinho7.jpeg" },
        { arquivo: "lobinho8.jpeg" },
        { arquivo: "lobinho9.jpeg" },
        { arquivo: "lobinho10.jpeg" }
    ];
    
    // Renderizar galeria
    function renderizarGaleria() {
        const grid = document.getElementById('galeriaGrid');
        grid.innerHTML = imagens.map(img => `
            <div class="galeria-item" onclick="abrirImagem('${img.arquivo}')">
                <img src="${img.arquivo}" alt="Momento no Café do Lobinho" onerror="this.src='https://placehold.co/400x400/121212/d4af37?text=Erro'">
            </div>
        `).join('');
    }
    
    // Abrir imagem no modal
    function abrirImagem(src) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        modal.style.display = 'flex';
        modalImg.src = src;
    }
    
    function fecharModal() {
        document.getElementById('modal').style.display = 'none';
    }
    
    // ========== TEMA ==========
    function alternarTema() {
        document.body.classList.toggle('tema-claro');
        const tema = document.body.classList.contains('tema-claro') ? 'claro' : 'escuro';
        localStorage.setItem('tema_galeria', tema);
        
        const btn = document.querySelector('.btn-tema');
        btn.classList.add('animar');
        setTimeout(() => btn.classList.remove('animar'), 500);
    }
    
    function carregarTema() {
        const temaSalvo = localStorage.getItem('tema_galeria');
        if (temaSalvo === 'claro') {
            document.body.classList.add('tema-claro');
        }
    }
    
    // ========== MENU HAMBURGUER ==========
    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const hamburger = document.getElementById('hamburger');
        
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
        hamburger.classList.toggle('active');
    }
    
    function fecharMenu() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const hamburger = document.getElementById('hamburger');
        
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
        hamburger.classList.remove('active');
    }
    
    // ========== ANIMAÇÕES SCROLL ==========
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };
    
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, observerOptions);
    
    // ========== INICIALIZAÇÃO ==========
    renderizarGaleria();
    carregarTema();
    
    // Observar itens da galeria após renderizar
    setTimeout(() => {
        document.querySelectorAll('.galeria-item').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'all 0.6s ease';
            observer.observe(el);
        });
    }, 100);
    
    document.querySelectorAll('.sidebar a').forEach(link => {
        link.addEventListener('click', fecharMenu);
    });
    
    // Fechar modal com ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            fecharModal();
        }
    });
    
    window.abrirImagem = abrirImagem;
    window.fecharModal = fecharModal;
    window.alternarTema = alternarTema;
    window.toggleMenu = toggleMenu;
    window.fecharMenu = fecharMenu;
</script>

</body>
</html>
